name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

      - name: Aucune phrase n'echappe au catalogue de traduction
        run: python scripts/audit_traductions.py

      - name: Les captures du README sont a jour
        run: |
          python scripts/screenshots.py
          if ! git diff --exit-code -- docs/screenshots; then
            echo "Les captures ont change. Relancez scripts/screenshots.py et commitez le resultat."
            exit 1
          fi

  integration:
    name: Cablage reel (7 services, deux clients de telechargement)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."

      - name: Installation complete
        run: |
          sudo mkdir -p /srv/data /opt/plugarr/config
          sudo chown -R "$(id -u):$(id -g)" /srv/data /opt/plugarr
          plugarr install --yes \
            --services prowlarr,sonarr,radarr,lidarr,transmission,qbittorrent,jellyfin \
            --data-root /srv/data \
            --config-root /opt/plugarr/config \
            --project-dir "$RUNNER_TEMP/stack"

      - name: Idempotence - le second passage ne doit rien creer
        run: |
          plugarr wire --project-dir "$RUNNER_TEMP/stack" | tee /tmp/second.log
          if grep -q "cree (id=" /tmp/second.log; then
            echo "ECHEC : le second passage a cree des ressources, le cablage n'est pas idempotent"
            exit 1
          fi

      - name: Deux clients torrent ne sont plus en alternance
        # Tous les clients etaient declares a la meme priorite, et Sonarr alterne
        # alors entre eux : « Round-Robin is used for clients of the same type
        # that have the same priority ». Les tests unitaires le verifient avec un
        # faux *arr ; ici on relit ce que le vrai Sonarr a enregistre, apres le
        # second passage de cablage.
        run: |
          set -a; . "$RUNNER_TEMP/stack/.env"; set +a
          curl -sf -H "X-Api-Key: $SONARR_API_KEY" http://localhost:8989/api/v3/downloadclient \
            -o "$RUNNER_TEMP/downloadclients.json"
          python - "$RUNNER_TEMP/downloadclients.json" <<'EOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fichier:
              clients = {c["name"]: c.get("priority") for c in json.load(fichier)}
          print("priorites relues dans Sonarr :", clients)
          attendu = {"qBittorrent": 1, "Transmission": 2}
          if {nom: clients.get(nom) for nom in attendu} != attendu:
              sys.exit(f"ECHEC : priorites {clients}, attendu {attendu}")
          EOF

      # Prowlarr embarque plus de 600 definitions d'indexeurs, dont la forme change
      # a chaque version. Cet audit echoue si une nouvelle definition expose un
      # champ d'identifiant que l'heuristique ne saurait pas reconnaitre.
      - name: Audit de l'heuristique sur toutes les definitions Prowlarr
        run: |
          set -a; . "$RUNNER_TEMP/stack/.env"; set +a
          curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" \
            http://localhost:9696/api/v1/indexer/schema -o "$RUNNER_TEMP/schema.json"
          python scripts/audit_indexers.py "$RUNNER_TEMP/schema.json"

      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose -p plugarr -f "$RUNNER_TEMP/stack/docker-compose.yml" logs --tail 100
