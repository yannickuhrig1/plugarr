name: Executable Windows

# L'executable retire le seul prerequis qui restait a un utilisateur Windows :
# installer Python. Il est construit ici pour que personne n'ait a le faire, et
# controle avant d'etre publie.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Construire et controler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install . pyinstaller

      - name: Construction
        env:
          PLUGARR_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: pyinstaller packaging/plugarr.spec --noconfirm

      - name: Le binaire repond
        run: |
          dist\plugarr.exe --help
          dist\plugarr.exe list | Select-String -Pattern "sonarr" -Quiet
          if (-not $?) { throw "le catalogue ne cite pas sonarr" }
        shell: pwsh

      - name: L'assistant vit dans l'executable
        # Ce qui casse le plus facilement a l'empaquetage est un fichier
        # non-Python absent de l'archive. `app.tcss` manquant : Textual leve
        # StylesheetError et l'assistant ne s'ouvre pas. `vpn_countries.json`
        # manquant en 0.1.8 : l'assistant s'ouvrait tres bien et plantait plus
        # loin, sur l'ecran VPN. Ce controle parcourt donc l'assistant jusque-la
        # au lieu de se contenter de l'ouvrir.
        run: |
          pyinstaller packaging/smoke_tui.py --onefile --console --noconfirm `
            --name smoke --distpath dist-smoke --workpath build-smoke --specpath build-smoke `
            --paths src --collect-all textual `
            --add-data "${{ github.workspace }}/src/plugarr/tui/app.tcss;plugarr/tui" `
            --add-data "${{ github.workspace }}/src/plugarr/data/vpn_countries.json;plugarr/data"
          dist-smoke\smoke.exe
        shell: pwsh

      - name: Les modules charges tardivement sont dans l'archive
        # `clients/silo.py` n'est importe qu'au fond d'une etape de cablage, et
        # `plugarr.exe` ne l'ouvre donc jamais avant qu'un utilisateur installe
        # Silo pour de vrai. Un module qu'aucun import de premier niveau ne
        # designe est exactement ce que l'empaquetage laisse au bord de la route
        # sans rien dire. On lit la liste que PyInstaller a REELLEMENT ecrite,
        # plutot que de faire confiance a son analyse.
        run: |
          $toc = Get-Content build\plugarr\Analysis-00.toc -Raw
          foreach ($m in @('plugarr.clients.silo','plugarr.langues',
                           'plugarr.clients.jellyfin','plugarr.wiring','plugarr.vpncheck',
                           'plugarr.sauvegarde','plugarr.clients.audiobookshelf',
                           'plugarr.clients.seerr','plugarr.i18n','plugarr.traductions',
                           'plugarr.tui.widgets')) {
            if ($toc -notmatch [regex]::Escape("'$m'")) {
              throw "$m absent de l'executable"
            }
            Write-Output "  $m"
          }
        shell: pwsh

      - name: Taille du binaire
        run: |
          $mo = [math]::Round((Get-Item dist\plugarr.exe).Length / 1MB, 1)
          Write-Output "plugarr.exe : $mo Mo"
        shell: pwsh

      - name: Le tag et la version du code concordent
        # La mise a jour d'une version installee cherche un fichier nomme
        # d'apres le TAG (PlugArr-Setup-<tag sans v>.exe), et l'installateur
        # est nomme d'apres __version__. Un ecart ne se verrait nulle part :
        # les versions installees resteraient simplement sur place.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = python -c "import plugarr; print(plugarr.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} et __version__ $version divergent"
          }
        shell: pwsh

      - name: Version installee, un dossier et deux executables
        env:
          PLUGARR_ONEDIR: "1"
          PLUGARR_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: pyinstaller packaging/plugarr.spec --noconfirm --distpath dist-onedir --workpath build-onedir
        shell: pwsh

      - name: Les deux executables repondent
        run: |
          dist-onedir\PlugArr\plugarr.exe --version
          $connu = dist-onedir\PlugArr\plugarr.exe manager --help | Select-String -Pattern "quitter" -Quiet
          if (-not $connu) { throw "plugarr manager ne connait pas --quitter, dont l'installateur a besoin" }
          if (-not (Test-Path dist-onedir\PlugArr\plugarr-admin.exe)) { throw "plugarr-admin.exe absent" }
        shell: pwsh

      - name: Installateur Inno Setup
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $version = python -c "import plugarr; print(plugarr.__version__)"
          & $iscc /Q "/DVersion=$version" "/DSource=$PWD\dist-onedir\PlugArr" "/DSortie=$PWD\dist" packaging\installer\plugarr.iss
          if ($LASTEXITCODE) { throw "ISCC a echoue" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        shell: pwsh

      - name: Installer, relancer, desinstaller, en silencieux
        # Ce que fera la mise a jour depuis le gestionnaire, sur une machine
        # propre : installer, reinstaller par-dessus, puis tout retirer. Les
        # DONNEES (PLUGARR_HOME) doivent survivre a la desinstallation.
        run: |
          $dossier = "$env:RUNNER_TEMP\PlugArr-essai"
          $env:PLUGARR_HOME = "$env:RUNNER_TEMP\plugarr-donnees"
          New-Item -ItemType Directory -Force $env:PLUGARR_HOME | Out-Null
          $setup = "dist\PlugArr-Setup-$env:VERSION.exe"
          foreach ($passe in 1, 2) {
            $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=`"$dossier`"" -Wait -PassThru
            if ($p.ExitCode) { throw "installation $passe : code $($p.ExitCode)" }
          }
          & "$dossier\plugarr.exe" --version
          $p = Start-Process "$dossier\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dossier\plugarr.exe") { throw "la desinstallation a laisse plugarr.exe" }
          if (-not (Test-Path $env:PLUGARR_HOME)) { throw "la desinstallation a efface les donnees" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: plugarr-windows
          path: |
            dist/plugarr.exe
            dist/PlugArr-Setup-*.exe
          if-no-files-found: error

      - name: Publier sur la release
        # `plugarr.exe` reste publie : les executables portables deja
        # distribues cherchent ce nom exact pour se mettre a jour.
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" dist/plugarr.exe "dist/PlugArr-Setup-$env:VERSION.exe" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
