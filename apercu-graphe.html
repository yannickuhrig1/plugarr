<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PlugArr — cablage</title>
<style>
:root {
  --primaire: #8B36C9;
  --secondaire: #E4638A;
  --accent: #F79B45;
  --succes: #3FB984;
  --alerte: #F79B45;
  --erreur: #E4485C;
  --fond: #100d18;
  --scene: #17131f;
  --panneau: #1a1624;
  --disque: #221b2f;
  --ligne: #2a2338;
  --texte: #ece9f3;
  --attenue: #928aa8;
  --degrade: linear-gradient(100deg, #F79B45, #E4638A 52%, #8B36C9);
  color-scheme: dark;
}

</style>
<style>
/* Feuille de style de l'assistant web.
 *
 * Le bloc `:root` n'est PAS ici : il est rendu par `brand.py` dans la page, pour
 * que les couleurs de la marque restent une seule source pour l'assistant
 * terminal et pour le navigateur. Ce fichier ne connait que des variables.
 *
 * Un seul theme, sombre. Le logo est concu pour un fond sombre, l'assistant
 * terminal l'est, et le graphe n'a de sens que la : un cable lumineux sur fond
 * clair perd tout. Suivre le theme du systeme donnait deux apparences dont une
 * seule etait dessinee.
 */

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 3rem 1.5rem 4rem;
  color: var(--texte);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Deux lueurs, aux couleurs des deux bouts du degrade, posees dans des coins
   * opposes. C'est ce qui empeche un fond sombre uni de paraitre eteint, sans
   * ajouter d'element a regarder. `fixed` les tient en place au defilement :
   * elles appartiennent a la fenetre, pas au document. */
  background:
    radial-gradient(60rem 40rem at 12% -10%, rgba(139, 54, 201, .20), transparent 60%),
    radial-gradient(50rem 35rem at 95% 8%, rgba(247, 155, 69, .12), transparent 55%),
    var(--fond);
  background-attachment: fixed;
  min-height: 100vh;
}

.wrap { max-width: 1120px; margin: 0 auto; }

/* -- l'en-tete ------------------------------------------------------------ */

header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 2rem;
}

/* Le logo lui-meme, inline dans la page : il porte son propre degrade et doit
 * donc rester un SVG, pas devenir une image. */
.mark { flex: 0 0 auto; line-height: 0; }
.mark svg { display: block; width: 46px; height: 46px; }

header h1 {
  margin: 0;
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -.025em;
}
header h1 .sous {
  color: var(--attenue);
  font-size: .95rem;
  font-weight: 400;
  letter-spacing: 0;
  margin-left: .35rem;
}
header p { margin: .15rem 0 0; color: var(--attenue); font-size: .95rem; }

/* -- la scene ------------------------------------------------------------- */

.scene {
  background: var(--scene);
  border: 1px solid var(--ligne);
  border-radius: 18px;
  padding: 1.2rem;
  overflow-x: auto;
  /* Un liseré clair en haut, une ombre portee dessous : la scene se detache du
   * fond sans qu'on ait a lui dessiner un cadre de plus. */
  box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 18px 40px rgba(0, 0, 0, .35);
}

.scene svg { display: block; width: 100%; height: auto; min-width: 700px; }

.entete-colonne {
  fill: var(--attenue);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
}

/* -- les pastilles -------------------------------------------------------- */

/* Chaque service est un disque. Le halo derriere l'anneau ne s'allume qu'une
 * fois le service cable : c'est ce qui fait lire le dessin d'un coup d'oeil,
 * sans compter les traits. */
.noeud .halo {
  fill: none;
  stroke: currentColor;
  stroke-width: 0;
  opacity: 0;
  transition: stroke-width .45s ease, opacity .45s ease;
}
.noeud .anneau {
  fill: var(--disque);
  stroke: var(--ligne);
  stroke-width: 2;
  transition: stroke .35s ease;
}
.noeud .pastille {
  fill: var(--attenue);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .04em;
  transition: fill .35s ease;
}
.noeud .logo {
  /* Desature tant que le service n'est pas cable : le graphe se lit alors par
   * la couleur, et pas seulement par les traits. */
  filter: grayscale(1);
  opacity: .4;
  transition: filter .45s ease, opacity .45s ease;
}
.noeud.actif .logo, .noeud.fait .logo { filter: none; opacity: 1; }
.noeud.echoue .logo { filter: grayscale(1); opacity: .55; }

.noeud .nom { fill: var(--texte); font-size: 12.5px; font-weight: 500; }
.noeud .sous { fill: var(--erreur); font-size: 10.5px; }

/* Un contour de la couleur du fond, dessine DERRIERE le texte.
 *
 * `paint-order: stroke` inverse l'ordre habituel : le trait est peint d'abord,
 * la lettre par-dessus. Le nom se decoupe donc dans les cables qui passent
 * derriere lui, au lieu de s'y perdre. Sur un graphe dense — trente-cinq cables
 * pour dix-sept services — les noms devenaient illisibles des que deux courbes
 * les traversaient. */
.noeud .nom, .noeud .sous {
  paint-order: stroke;
  stroke: var(--scene);
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

/* La teinte de la colonne : violet pour l'indexeur, rose pour les *arr, orange
 * pour le telechargement, vert pour le VPN. Elle ne vaut QUE par
 * `currentColor`, ce qui evite d'ecrire six regles par etat. */
.noeud.teinte-primaire { color: var(--primaire); }
.noeud.teinte-secondaire { color: var(--secondaire); }
.noeud.teinte-accent { color: var(--accent); }
.noeud.teinte-succes { color: var(--succes); }

.noeud.actif .anneau { stroke: var(--accent); }
.noeud.actif .pastille { fill: var(--accent); }

.noeud.fait .anneau { stroke: currentColor; }
.noeud.fait .pastille { fill: var(--texte); }
.noeud.fait .halo { stroke-width: 7; opacity: .2; }

.noeud.echoue .anneau { stroke: var(--erreur); }
.noeud.echoue .pastille { fill: var(--erreur); }
.noeud.echoue .halo { stroke: var(--erreur); stroke-width: 7; opacity: .22; }

/* -- les cables ----------------------------------------------------------- */

/* Un cable existe en deux exemplaires superposes : le trace fantome, toujours
 * visible, qui montre ce qui RESTE a brancher ; et le trace vivant, qui se tire
 * de la source vers la cible quand l'etape aboutit. */
.fantome {
  fill: none;
  stroke: var(--ligne);
  stroke-width: 2;
  stroke-dasharray: 3 7;
  stroke-linecap: round;
}
.vivant {
  fill: none;
  stroke: url(#cable);
  stroke-width: 4.5;
  stroke-linecap: round;
  /* La valeur par defaut n'est PAS un detail. `--longueur` n'est posee qu'au
   * moment du branchement, quand on mesure le trace. Sans defaut ici, les deux
   * declarations sont invalides a la resolution, `stroke-dasharray` retombe sur
   * son initiale `none`, et le cable se dessine PLEIN : tous les liens
   * paraissaient branches avant la premiere etape, ce qui vide le dessin de son
   * sens. 4000 depasse toute longueur reelle, donc le cable est entierement
   * decale hors de lui-meme — invisible jusqu'a la mesure. */
  --longueur: 4000;
  stroke-dasharray: var(--longueur);
  stroke-dashoffset: var(--longueur);
  transition: stroke-dashoffset .7s cubic-bezier(.4, 0, .2, 1);
}
.vivant.tire { stroke-dashoffset: 0; }
.vivant.echoue { stroke: var(--erreur); }

.bille { fill: #fff; opacity: 0; }
.bille.court { opacity: .95; }

/* Le flux : des tirets qui remontent le cable en boucle, une fois branche.
 *
 * Il ne porte aucune information que le trait ne donne deja. Son role est de
 * distinguer un lien VIVANT d'un lien seulement etabli — c'est la difference
 * entre un schema et une installation qui tourne.
 *
 * Un trace SEPARE du trait vivant, et non le meme : animer le `dash` du trait
 * lui-meme detruirait le `stroke-dashoffset` qui sert a le tirer. */
.flux {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 1 16;
  opacity: 0;
}
.flux.coule {
  opacity: .55;
  animation: coule 1.1s linear infinite;
}

@keyframes coule {
  /* 17 = la somme du motif. Decaler d'exactement un motif boucle sans saut. */
  from { stroke-dashoffset: 17; }
  to { stroke-dashoffset: 0; }
}

/* -- les prises ----------------------------------------------------------- */

/* Eteintes, elles montrent ou le cable IRA se brancher. Celle d'arrivee ne
 * s'allume qu'au moment ou la bille l'atteint. */
.prise rect {
  fill: var(--ligne);
  transition: fill .3s ease;
}
.prise .corps { fill: var(--disque); stroke: var(--ligne); stroke-width: 1.5; }

.prise.branchee rect { fill: var(--secondaire); }
.prise.branchee .corps { fill: var(--disque); stroke: var(--secondaire); }

.prise.echouee rect { fill: var(--erreur); }
.prise.echouee .corps { fill: var(--disque); stroke: var(--erreur); }

/* Quelqu'un qui a demande moins d'animations ne veut pas d'un trait qui rampe.
 * Le cable apparait alors d'un coup : l'information est la, le mouvement non. */
@media (prefers-reduced-motion: reduce) {
  .vivant, .noeud .halo, .noeud .anneau, .barre i { transition: none; }
  .bille { display: none; }
  /* Le flux est laisse VISIBLE mais immobile : les tirets disent encore
   * « ce lien est actif », sans le mouvement continu qui est precisement ce
   * qu'on a demande a ne pas subir. */
  .flux.coule { animation: none; }
}

/* -- la console ----------------------------------------------------------- */

.console { margin-top: 1.6rem; }

.etat {
  display: flex;
  align-items: baseline;
  gap: .85rem;
  margin-bottom: .7rem;
}
.etat .compte {
  flex: 0 0 auto;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -.02em;
  /* Le compte porte le degrade du logo : c'est le seul chiffre de la page, et
   * il dit ou en est le cablage. */
  background: var(--degrade);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  /* Les chiffres de meme largeur : sans cela le compte se dandine a chaque
   * increment, et l'oeil suit ce mouvement au lieu de la barre. */
  font-variant-numeric: tabular-nums;
}
.etat .quoi {
  color: var(--attenue);
  font-size: .92rem;
  /* Le nom d'etape est long et change a chaque seconde : il ne doit jamais
   * pousser le compte ni faire sauter la ligne. */
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.barre {
  height: 6px;
  border-radius: 999px;
  background: var(--ligne);
  overflow: hidden;
}
.barre i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: var(--degrade);
  transition: width .4s ease;
}

.journal {
  margin-top: 1.1rem;
  border: 1px solid var(--ligne);
  border-radius: 12px;
  background: var(--panneau);
  max-height: 16rem;
  overflow-y: auto;
  font-size: 13px;
}
.journal div {
  display: flex;
  align-items: baseline;
  gap: .7rem;
  padding: .5rem .95rem;
  border-bottom: 1px solid var(--ligne);
}
.journal div:last-child { border-bottom: 0; }
.journal .pastille { flex: 0 0 auto; font-size: 10px; }
.journal .ok .pastille { color: var(--succes); }
.journal .ko .pastille { color: var(--erreur); }
/* Le detail est pousse a droite : les noms d'etapes s'alignent alors a gauche
 * sur une colonne nette, et le journal se parcourt d'un coup d'oeil. */
.journal .detail {
  color: var(--attenue);
  margin-left: auto;
  padding-left: 1rem;
  text-align: right;
}
.journal .ko .detail { color: var(--erreur); }

footer {
  margin-top: 2rem;
  color: var(--attenue);
  font-size: 12px;
  opacity: .7;
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PlugArr">
  <title>PlugArr</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F79B45"/>
      <stop offset="52%" stop-color="#E4638A"/>
      <stop offset="100%" stop-color="#8B36C9"/>
    </linearGradient>
  </defs>

  <!-- Le A. Deux jambages et une barre : trace en une seule forme pour rester
       net a 16 px, la taille de l'onglet et de la barre des taches. -->
  <path fill="url(#g)" d="
    M128 30 h26 l62 172 h-44 l-13-38 h-19 l-11-32 h19 L128 92 100 202 H56 Z"/>

  <!-- Le cable : une prise a chaque bout, deux fleches qui se croisent. C'est
       la promesse du produit — il ne pose pas des services, il les RELIE. -->
  <g fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round">
    <path d="M74 178 C 104 150, 146 150, 172 122"/>
    <path d="M182 152 C 152 180, 110 180, 84 208"/>
  </g>
  <g fill="url(#g)">
    <path d="M172 122 l30 -6 -12 26 z"/>
    <path d="M84 208 l-30 6 12 -26 z"/>
  </g>
  <g stroke="url(#g)" stroke-width="9" stroke-linecap="round">
    <path d="M196 100 l10 -14"/>
    <path d="M210 112 l12 -12"/>
    <path d="M60 230 l-10 14"/>
    <path d="M46 218 l-12 12"/>
  </g>
</svg>
</span>
    <div class="titres">
      <h1>PlugArr <span class="sous">cablage</span></h1>
      <p>Chaque trait est un lien que plugarr etablit entre deux services.</p>
    </div>
  </header>

  <section class="scene">
    <div id="graphe"></div>
  </section>

  <section class="console">
    <div class="etat">
      <span class="compte" id="compte">0 / 40</span>
      <span class="quoi" id="quoi">En attente...</span>
    </div>
    <div class="barre"><i id="barre"></i></div>
    <div class="journal" id="journal"></div>
  </section>

  <footer>plugarr 0.7.1</footer>
</div>
<script>
/* Dessine le graphe de cablage et l'anime au fil des etapes.
 *
 * Ce fichier est servi tel quel, comme ressource statique. Il n'est JAMAIS
 * assemble dans une chaine Python : la console d'administration avait perdu tout
 * son JavaScript pendant trois versions publiees parce qu'une apostrophe
 * francaise fermait la chaine qui le portait, et rien ne le signalait — le HTML
 * restait parfaitement bien forme. Un vrai fichier ne peut pas subir cela, et il
 * s'ouvre dans le navigateur pour etre relu.
 *
 * Le dessin reprend le langage de la marque : scene sombre, pastilles rondes,
 * cables en degrade orange-rose-violet, et une PRISE a chaque extremite. La
 * prise n'est pas un ornement : elle dit ce que plugarr fait, brancher un
 * service dans un autre, et son enclenchement donne l'instant ou le lien existe.
 *
 * Deux entrees, une seule mecanique :
 *
 *   - `source: "sse"`   les evenements arrivent d'une installation en cours ;
 *   - `source: "rejeu"` une liste d'evenements deja connus est rejouee, ce qui
 *                       permet de relire le dessin sans rien installer.
 *
 * Aucune phrase n'est ecrite ici : elles viennent de Python via `libelles`. Une
 * chaine posee dans un `.js` echappe a la traduction ET a son audit.
 */

(function () {
  "use strict";

  var COL_LARGEUR = 224;
  var RAYON = 30;
  var ESPACE_V = 96;
  var MARGE_HAUT = 56;
  var MARGE_BAS = 34;

  /* De combien la prise recule par rapport au bord de la pastille. Assez pour
   * qu'on voie le corps de la prise, pas au point de detacher le cable. */
  var RECUL = 12;
  var DUREE = 700;

  function svgEl(nom, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", nom);
    for (var cle in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, cle)) {
        el.setAttribute(cle, attrs[cle]);
      }
    }
    return el;
  }

  /* Pose les pastilles en colonnes et renvoie leurs centres.
   *
   * Les colonnes vides sont retirees AVANT le calcul : une stack sans client de
   * telechargement laissait sinon un vide au milieu du dessin, et les cables le
   * traversaient sans raison visible. */
  function disposer(plan) {
    var colonnes = plan.colonnes.filter(function (c) {
      return plan.noeuds.some(function (n) { return n.colonne === c; });
    });

    var positions = {};
    var hauteurMax = 0;

    colonnes.forEach(function (colonne) {
      var dedans = plan.noeuds.filter(function (n) { return n.colonne === colonne; });
      hauteurMax = Math.max(hauteurMax, dedans.length * ESPACE_V - (ESPACE_V - 2 * RAYON));
    });

    colonnes.forEach(function (colonne, index) {
      var dedans = plan.noeuds.filter(function (n) { return n.colonne === colonne; });
      var hauteur = dedans.length * ESPACE_V - (ESPACE_V - 2 * RAYON);
      /* Chaque colonne est centree verticalement : sans cela, une colonne a une
       * seule pastille restait collee en haut et les cables plongeaient. */
      var decalage = (hauteurMax - hauteur) / 2;
      dedans.forEach(function (noeud, rang) {
        positions[noeud.id] = {
          cx: index * COL_LARGEUR + RAYON + 30,
          cy: MARGE_HAUT + decalage + RAYON + rang * ESPACE_V,
          noeud: noeud
        };
      });
    });

    return {
      colonnes: colonnes,
      positions: positions,
      largeur: (colonnes.length - 1) * COL_LARGEUR + 2 * RAYON + 60,
      hauteur: MARGE_HAUT + hauteurMax + MARGE_BAS
    };
  }

  /* Le trace d'un cable, de bord de pastille a bord de pastille.
   *
   * Il part et arrive HORIZONTALEMENT, ce qui donne aux prises un angle franc :
   * une prise de travers ne ressemble a rien. Le sens compte — `qui` remonte le
   * dessin de droite a gauche — et on sort alors par le bord oppose pour que le
   * cable contourne au lieu de traverser la pastille. */
  function courbe(depart, arrivee) {
    var versLaDroite = arrivee.cx > depart.cx;
    var sens = versLaDroite ? 1 : -1;
    var x1 = depart.cx + sens * (RAYON + RECUL);
    var y1 = depart.cy;
    var x2 = arrivee.cx - sens * (RAYON + RECUL);
    var y2 = arrivee.cy;
    var pousse = Math.max(52, Math.abs(x2 - x1) * 0.5) * sens;
    return {
      d: "M" + x1 + "," + y1 + " C" + (x1 + pousse) + "," + y1 +
         " " + (x2 - pousse) + "," + y2 + " " + x2 + "," + y2,
      depart: { x: x1, y: y1, angle: versLaDroite ? 0 : 180 },
      arrivee: { x: x2, y: y2, angle: versLaDroite ? 180 : 0 }
    };
  }

  /* Une prise : un corps et deux broches, dessines vers la gauche depuis le
   * point de branchement, puis pivotes. C'est la forme du logo, reduite. */
  function prise(point) {
    var groupe = svgEl("g", {
      "class": "prise",
      transform: "translate(" + point.x + "," + point.y + ") rotate(" + point.angle + ")"
    });
    groupe.appendChild(svgEl("rect", {
      x: -13, y: -9, width: 13, height: 18, rx: 3.5, "class": "corps"
    }));
    groupe.appendChild(svgEl("rect", { x: 0, y: -5.4, width: 7, height: 3, rx: 1.5 }));
    groupe.appendChild(svgEl("rect", { x: 0, y: 2.4, width: 7, height: 3, rx: 1.5 }));
    return groupe;
  }

  function degrade(id, stops) {
    var grad = svgEl("linearGradient", { id: id, x1: "0", y1: "0", x2: "1", y2: "0" });
    stops.forEach(function (stop) {
      grad.appendChild(svgEl("stop", {
        offset: (stop[0] * 100) + "%", "stop-color": stop[1]
      }));
    });
    return grad;
  }

  function dessiner(hote, plan, libelles) {
    var mise = disposer(plan);
    var svg = svgEl("svg", {
      viewBox: "0 0 " + mise.largeur + " " + mise.hauteur,
      role: "img",
      "aria-label": libelles.graphe || "graphe"
    });

    /* Le degrade est declare UNE fois et partage par tous les cables. Un
     * degrade par cable multiplierait les noeuds sans rien changer a l'oeil. */
    var defs = svgEl("defs", {});
    defs.appendChild(degrade("cable", plan.cable || [[0, "#F79B45"], [1, "#8B36C9"]]));
    svg.appendChild(defs);

    var coucheCables = svgEl("g", {});
    var couchePrises = svgEl("g", {});
    var coucheNoeuds = svgEl("g", {});
    svg.appendChild(coucheCables);
    svg.appendChild(couchePrises);
    svg.appendChild(coucheNoeuds);

    mise.colonnes.forEach(function (colonne, index) {
      var titre = svgEl("text", {
        x: index * COL_LARGEUR + RAYON + 30,
        y: 22,
        "text-anchor": "middle",
        "class": "entete-colonne"
      });
      titre.textContent = (libelles.colonnes || {})[colonne] || colonne;
      svg.insertBefore(titre, coucheCables);
    });

    var cables = {};
    var permanents = [];
    plan.liens.forEach(function (lien) {
      var depart = mise.positions[lien.source];
      var arrivee = mise.positions[lien.cible];
      if (!depart || !arrivee) { return; }
      var trace = courbe(depart, arrivee);

      coucheCables.appendChild(svgEl("path", { d: trace.d, "class": "fantome" }));
      var vivant = svgEl("path", { d: trace.d, "class": "vivant" });
      coucheCables.appendChild(vivant);
      var bille = svgEl("circle", { r: 4, "class": "bille" });
      coucheCables.appendChild(bille);

      /* Le flux : des tirets qui remontent le cable en boucle une fois celui-ci
       * branche. Il ne porte aucune information que le trait ne donne deja —
       * son role est de montrer qu'un lien est VIVANT et pas seulement etabli. */
      var flux = svgEl("path", { d: trace.d, "class": "flux" });
      coucheCables.appendChild(flux);

      var priseDepart = prise(trace.depart);
      var priseArrivee = prise(trace.arrivee);
      couchePrises.appendChild(priseDepart);
      couchePrises.appendChild(priseArrivee);

      var cable = {
        vivant: vivant,
        flux: flux,
        bille: bille,
        prises: [priseDepart, priseArrivee],
        lien: lien
      };

      /* Un tunnel VPN nait branche : il est pose par le fichier compose, donc
       * vrai avant la premiere etape, et aucun evenement ne viendra l'allumer. */
      if (lien.permanent) {
        permanents.push(cable);
        return;
      }

      /* UNE etape peut porter PLUSIEURS cables : `seerr/setup` etablit a lui
       * seul les liens vers Jellyfin, Sonarr et Radarr. Indexer un cable par
       * etape en perdait donc deux sur trois. */
      if (!cables[lien.etape]) { cables[lien.etape] = []; }
      cables[lien.etape].push(cable);
    });

    var noeuds = {};
    plan.noeuds.forEach(function (noeud) {
      var pos = mise.positions[noeud.id];
      if (!pos) { return; }
      var groupe = svgEl("g", {
        "class": "noeud teinte-" + noeud.teinte, "data-service": noeud.id
      });
      groupe.appendChild(svgEl("circle", { cx: pos.cx, cy: pos.cy, r: RAYON, "class": "halo" }));
      groupe.appendChild(svgEl("circle", { cx: pos.cx, cy: pos.cy, r: RAYON, "class": "anneau" }));

      /* Le logo s'il a ete embarque, les deux lettres sinon. Le dossier des
       * logos peut etre vide — aucune licence libre n'accorde de droit de
       * marque — et le dessin doit tenir dans les deux cas. */
      if (noeud.logo) {
        var image = svgEl("image", {
          x: pos.cx - 21, y: pos.cy - 21, width: 42, height: 42,
          href: noeud.logo, "clip-path": "circle(21px)", "class": "logo"
        });
        /* `href` seul suffit en SVG 2, mais Safari a longtemps exige la forme
         * XLink et l'ignore silencieusement sans elle : l'image ne s'affiche
         * pas, et rien ne le signale. Les deux coutent un attribut. */
        image.setAttributeNS("http://www.w3.org/1999/xlink", "href", noeud.logo);
        groupe.appendChild(image);
      } else {
        var pastille = svgEl("text", {
          x: pos.cx, y: pos.cy + 6, "text-anchor": "middle", "class": "pastille"
        });
        pastille.textContent = noeud.pastille;
        groupe.appendChild(pastille);
      }

      var nom = svgEl("text", {
        x: pos.cx, y: pos.cy + RAYON + 18, "text-anchor": "middle", "class": "nom"
      });
      nom.textContent = noeud.nom;
      groupe.appendChild(nom);

      var sous = svgEl("text", {
        x: pos.cx, y: pos.cy + RAYON + 31, "text-anchor": "middle", "class": "sous"
      });
      groupe.appendChild(sous);

      coucheNoeuds.appendChild(groupe);
      noeuds[noeud.id] = { groupe: groupe, sous: sous };
    });

    hote.innerHTML = "";
    hote.appendChild(svg);
    return { cables: cables, permanents: permanents, noeuds: noeuds };
  }

  /* Branche le cable : le trait se tire de la source vers la cible, une bille le
   * remonte, et la prise d'arrivee s'enclenche quand elle arrive.
   *
   * `stroke-dashoffset` ne s'anime que si la longueur est connue : on la mesure
   * sur le trace reel plutot que de l'estimer, sinon le trait saute a la fin. */
  function brancher(cable, ok) {
    var longueur = cable.vivant.getTotalLength();
    cable.vivant.style.setProperty("--longueur", longueur);
    if (!ok) { cable.vivant.classList.add("echoue"); }
    /* Un reflow force AVANT d'ajouter la classe : sans lui, le navigateur voit
     * la longueur et l'offset final dans le meme lot et n'anime rien. */
    void cable.vivant.getBoundingClientRect();
    cable.vivant.classList.add("tire");
    cable.prises[0].classList.add(ok ? "branchee" : "echouee");

    /* L'ETAT FINAL est pose par un minuteur, JAMAIS par requestAnimationFrame.
     *
     * Un onglet qui n'est pas au premier plan ne recoit plus de frames. La
     * bille s'arretait alors en chemin et, comme tout l'etat d'arrivee pendait a
     * la fin de sa course, la prise d'arrivee et le flux n'arrivaient jamais —
     * definitivement. Constate en ouvrant la page : 31 cables sur 35 tires,
     * mais leur prise d'arrivee eteinte et aucun flux, bien apres la fin.
     *
     * Un `setTimeout` est ralenti en arriere-plan, mais il FINIT par se
     * declencher. Le mouvement est cosmetique ; l'etat ne doit pas en dependre. */
    window.setTimeout(function () {
      cable.bille.classList.remove("court");
      /* La prise d'arrivee ne s'allume qu'ICI, une fois le cable parcouru :
       * c'est ce decalage qui fait lire « ca vient de se brancher » plutot que
       * « c'est branche depuis toujours ». */
      cable.prises[1].classList.add(ok ? "branchee" : "echouee");
      /* Et le flux part dans la foulee : un lien etabli est un lien qui
       * travaille. Un lien en echec ne coule pas. */
      if (ok) { cable.flux.classList.add("coule"); }
    }, DUREE);

    /* La bille, elle, est purement decorative : si les frames manquent, elle
     * n'avance pas, et ce n'est pas grave. */
    var bille = cable.bille;
    var debut = null;
    bille.classList.add("court");
    function pas(horodatage) {
      if (debut === null) { debut = horodatage; }
      var avance = Math.min(1, (horodatage - debut) / DUREE);
      var point = cable.vivant.getPointAtLength(longueur * avance);
      bille.setAttribute("cx", point.x);
      bille.setAttribute("cy", point.y);
      if (avance < 1) { requestAnimationFrame(pas); }
    }
    requestAnimationFrame(pas);
  }

  /* Combien d'etapes reste-t-il a chaque service ?
   *
   * Sans ce compte, une pastille allumee par son premier reglage y restait
   * jusqu'a la fin : Prowlarr affichait « en cours » alors que ses onze cables
   * etaient branches depuis longtemps. Un service n'est fini que lorsque PLUS
   * AUCUNE etape ne le concerne — ses reglages comme les cables dont il est une
   * extremite. */
  function compterRestant(plan) {
    /* On compte les ETAPES DISTINCTES qui concernent chaque service, pas les
     * cables. `seerr/setup` est a la fois un reglage de Seerr et l'etape de ses
     * trois liens : le compter quatre fois laissait Seerr « en cours » a jamais,
     * puisqu'un seul evenement arrive. */
    var etapes = {};
    plan.noeuds.forEach(function (noeud) {
      etapes[noeud.id] = {};
      noeud.reglages.forEach(function (etape) { etapes[noeud.id][etape] = true; });
    });
    plan.liens.forEach(function (lien) {
      /* Un tunnel VPN n'attend rien : il est deja la. Le compter laisserait
       * Gluetun et son client eternellement « en cours ». */
      if (lien.permanent) { return; }
      if (etapes[lien.source]) { etapes[lien.source][lien.etape] = true; }
      if (etapes[lien.cible]) { etapes[lien.cible][lien.etape] = true; }
    });

    var restant = {};
    Object.keys(etapes).forEach(function (id) {
      restant[id] = Object.keys(etapes[id]).length;
    });
    return restant;
  }

  /* Pose un cable dans son etat final, sans le tirer.
   *
   * Rejouer l'animation de branchement pour un tunnel VPN mentirait : il n'a
   * pas ete etabli pendant l'installation, il existait avant elle. */
  function poserBranche(cable) {
    var longueur = cable.vivant.getTotalLength();
    cable.vivant.style.setProperty("--longueur", longueur);
    cable.vivant.classList.add("tire");
    cable.flux.classList.add("coule");
    cable.prises[0].classList.add("branchee");
    cable.prises[1].classList.add("branchee");
  }

  function Animation(hote, plan, cadres, libelles) {
    var dessin = dessiner(hote, plan, libelles);
    var total = plan.etapes.length;
    var faits = 0;
    var restant = compterRestant(plan);
    var echecs = {};

    /* Les tunnels naissent branches, et leurs extremites doivent naitre avec.
     *
     * Gluetun n'a aucune etape : rien ne serait jamais venu le marquer, et il
     * restait gris — logo desature, anneau eteint — au bout de deux cables
     * vivants. Un service qu'aucune etape n'attend est deja fini. Le client de
     * telechargement, lui, a ses propres etapes : son compte n'est pas a zero,
     * il continue donc son chemin normalement. */
    dessin.permanents.forEach(function (cable) {
      poserBranche(cable);
      [cable.lien.source, cable.lien.cible].forEach(function (id) {
        if (dessin.noeuds[id] && !restant[id]) {
          dessin.noeuds[id].groupe.classList.add("fait");
        }
      });
    });

    /* Passe une pastille a l'etat que son compte justifie. Un echec l'emporte
     * sur une reussite : un service dont un seul cable a lache n'est pas fini. */
    function marquer(service, ok, detail) {
      var noeud = dessin.noeuds[service];
      if (!noeud) { return; }
      /* Le sous-titre ne sert QU'A dire pourquoi ca a rate. Il portait le detail
       * de chaque etape, y compris « cree » : une pastille rouge finissait donc
       * legendee « cree », et le dessin se contredisait. Le deroule complet est
       * dans le journal, juste dessous ; ici il ne reste que ce qui alerte. */
      if (!ok) {
        echecs[service] = true;
        noeud.sous.textContent = detail ? String(detail).slice(0, 22) : libelles.echec;
      }
      if (restant[service] !== undefined && restant[service] > 0) {
        restant[service] -= 1;
      }
      var classes = noeud.groupe.classList;
      classes.remove("actif");
      classes.remove("fait");
      classes.remove("echoue");
      if (restant[service] > 0) {
        classes.add("actif");
      } else {
        classes.add(echecs[service] ? "echoue" : "fait");
      }
    }

    function journaliser(evenement) {
      if (!cadres.journal) { return; }
      var ligne = document.createElement("div");
      ligne.className = evenement.ok ? "ok" : "ko";
      var pastille = document.createElement("span");
      pastille.className = "pastille";
      pastille.textContent = evenement.ok ? "●" : "✕";
      var titre = document.createElement("span");
      titre.textContent = evenement.nom || evenement.etape;
      var detail = document.createElement("span");
      detail.className = "detail";
      detail.textContent = evenement.detail || "";
      ligne.appendChild(pastille);
      ligne.appendChild(titre);
      ligne.appendChild(detail);
      cadres.journal.appendChild(ligne);
      cadres.journal.scrollTop = cadres.journal.scrollHeight;
    }

    this.appliquer = function (evenement) {
      faits += 1;
      /* Les services que CET evenement fait avancer, chacun une seule fois :
       * `marquer` decremente, et le compte porte sur les etapes distinctes. */
      var touches = {};
      var groupe = dessin.cables[evenement.etape];
      if (groupe) {
        groupe.forEach(function (cable) {
          /* Un cable engage ses DEUX extremites : Prowlarr autant que Sonarr. */
          brancher(cable, evenement.ok);
          touches[cable.lien.source] = true;
          touches[cable.lien.cible] = true;
        });
      }
      /* Un reglage : pas de cable a brancher, mais la pastille concernee doit
       * montrer qu'il se passe quelque chose. Sans cela, un service dont plugarr
       * ne fait que la configuration restait gris de bout en bout. Une meme
       * etape peut etre les deux — `seerr/setup` regle Seerr ET le relie. */
      var service = (evenement.etape || "").split("/")[0];
      if (dessin.noeuds[service]) { touches[service] = true; }

      Object.keys(touches).forEach(function (id) {
        marquer(id, evenement.ok, evenement.detail);
      });

      if (cadres.compte) { cadres.compte.textContent = faits + " / " + total; }
      if (cadres.quoi) { cadres.quoi.textContent = evenement.nom || evenement.etape || ""; }
      if (cadres.barre) {
        cadres.barre.style.width = (total ? (faits / total) * 100 : 100) + "%";
      }
      journaliser(evenement);
    };

    this.terminer = function () {
      Object.keys(dessin.noeuds).forEach(function (id) {
        dessin.noeuds[id].groupe.classList.remove("actif");
      });
      if (cadres.quoi) { cadres.quoi.textContent = libelles.termine; }
    };
  }

  function demarrer(options) {
    var hote = document.getElementById("graphe");
    if (!hote || !options || !options.plan) { return null; }
    var animation = new Animation(hote, options.plan, {
      compte: document.getElementById("compte"),
      quoi: document.getElementById("quoi"),
      barre: document.getElementById("barre"),
      journal: document.getElementById("journal")
    }, options.libelles || {});

    if (options.source === "sse") {
      var flux = new EventSource(options.url || "/api/evenements");
      flux.onmessage = function (message) {
        var evenement = JSON.parse(message.data);
        if (evenement.fini) {
          animation.terminer();
          flux.close();
          return;
        }
        animation.appliquer(evenement);
      };
      return animation;
    }

    /* Rejeu : les evenements sont deja connus. Le decalage donne le meme rythme
     * qu'une installation reelle, ce qui permet de juger le dessin sans en
     * lancer une. */
    var reste = (options.evenements || []).slice();
    var pause = options.pause || 550;
    (function suivant() {
      if (!reste.length) { animation.terminer(); return; }
      animation.appliquer(reste.shift());
      window.setTimeout(suivant, pause);
    })();
    return animation;
  }

  window.PlugArrGraphe = { demarrer: demarrer, disposer: disposer, courbe: courbe };
})();

</script>
