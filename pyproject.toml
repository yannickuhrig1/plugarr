[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugarr"
dynamic = ["version"]
description = "Deploie ET cable automatiquement une stack media *arr complete"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "textual>=0.80",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
plugarr = "plugarr.cli:app"

[tool.hatch.version]
path = "src/plugarr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plugarr"]
# TOUT fichier non-Python dont le code a besoin a l'execution. Un oubli ici ne
# se voit pas au developpement — le fichier est la, dans l'arborescence source —
# mais fait planter le paquet installe. Voir tests/test_empaquetage.py.
artifacts = ["*.tcss", "*.json", "*.html", "*.css", "*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 : passer typer.Option en valeur par defaut EST l'idiome officiel de Typer.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# BINDINGS est un attribut de classe mutable impose par Textual.
"src/plugarr/tui/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
